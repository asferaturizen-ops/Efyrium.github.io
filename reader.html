<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radiant Spirit Efy Supreme — Глава I | Efy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/reader.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
</head>
<body class="bg-[#07060b] text-gray-200 overflow-hidden theme-cosmic">
  
  <canvas id="effect-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <header id="top-bar" class="fixed top-0 left-0 right-0 z-40 bg-[#07060b]/90 backdrop-blur-xl border-b border-white/5 transition-all duration-300">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="book.html" class="text-gray-400 hover:text-white transition text-sm flex items-center gap-1.5">
          <span>←</span> <span class="hidden sm:inline">К книге</span>
        </a>
        <div class="h-4 w-px bg-white/10 hidden sm:block"></div>
        <div class="min-w-0">
          <h1 class="font-cinzel text-sm text-white truncate">Radiant Spirit Efy Supreme</h1>
          <p class="text-[11px] text-violet-400/80 truncate" id="chapter-label">Глава I · Пробуждение Эфира</p>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button id="btn-chapters" class="p-2 rounded-lg hover:bg-white/5 transition text-gray-400 hover:text-white" title="Главы">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h7"/></svg>
        </button>
        <button id="btn-settings" class="p-2 rounded-lg hover:bg-white/5 transition text-gray-400 hover:text-white" title="Настройки">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
        </button>
        <button id="btn-fullscreen" class="p-2 rounded-lg hover:bg-white/5 transition text-gray-400 hover:text-white" title="Полный экран (F)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <aside id="chapters-panel" class="fixed top-0 left-0 h-full w-72 bg-[#0c0b12]/95 backdrop-blur-2xl border-r border-white/10 z-50 transform -translate-x-full transition-transform duration-300 overflow-y-auto">
    <div class="p-5">
      <div class="flex items-center justify-between mb-6">
        <h2 class="font-cinzel text-lg text-white">Главы</h2>
        <button id="close-chapters" class="p-1.5 rounded-lg hover:bg-white/5 text-gray-400">✕</button>
      </div>
      <div class="space-y-1" id="chapters-list">
        <button class="chapter-item active w-full text-left px-4 py-3 rounded-xl bg-violet-600/20 border border-violet-500/30" data-chapter="1">
          <span class="text-xs text-violet-400">Глава I</span>
          <p class="text-sm text-white mt-0.5">Пробуждение Эфира</p>
        </button>
        <button class="chapter-item w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 border border-transparent" data-chapter="2">
          <span class="text-xs text-gray-500">Глава II</span>
          <p class="text-sm text-gray-300 mt-0.5">Первый Рассвет</p>
        </button>
        <button class="chapter-item w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 border border-transparent opacity-50" data-chapter="3" disabled>
          <span class="text-xs text-gray-600">Глава III</span>
          <p class="text-sm text-gray-500 mt-0.5">Скоро...</p>
        </button>
      </div>
    </div>
  </aside>

  <aside id="settings-panel" class="fixed top-0 right-0 h-full w-80 bg-[#0c0b12]/95 backdrop-blur-2xl border-l border-white/10 z-50 transform translate-x-full transition-transform duration-300 overflow-y-auto">
    <div class="p-6">
      <div class="flex items-center justify-between mb-8">
        <h2 class="font-cinzel text-lg text-white">Настройки чтения</h2>
        <button id="close-settings" class="p-1.5 rounded-lg hover:bg-white/5 text-gray-400">✕</button>
      </div>
      <div class="mb-8">
        <label class="text-xs uppercase tracking-wider text-gray-500 mb-3 block">Размер текста</label>
        <div class="flex items-center gap-3">
          <button id="font-decrease" class="w-10 h-10 rounded-lg bg-white/5 hover:bg-white/10 text-lg">A−</button>
          <input type="range" id="font-size" min="16" max="28" value="19" class="flex-1 accent-violet-500">
          <button id="font-increase" class="w-10 h-10 rounded-lg bg-white/5 hover:bg-white/10 text-lg">A+</button>
        </div>
        <p class="text-center text-sm text-gray-500 mt-2"><span id="font-size-value">19</span>px</p>
      </div>
      <div class="mb-8">
        <label class="text-xs uppercase tracking-wider text-gray-500 mb-3 block">Шрифт</label>
        <div class="grid grid-cols-1 gap-2">
          <button class="font-option active px-4 py-2.5 rounded-lg bg-violet-600/20 border border-violet-500/40 text-left text-sm" data-font="'Cormorant Garamond', serif">Cormorant Garamond</button>
          <button class="font-option px-4 py-2.5 rounded-lg bg-white/5 border border-white/10 hover:border-violet-500/30 text-left text-sm" data-font="'Literata', serif">Literata</button>
          <button class="font-option px-4 py-2.5 rounded-lg bg-white/5 border border-white/10 hover:border-violet-500/30 text-left text-sm" data-font="'Inter', sans-serif">Inter</button>
        </div>
      </div>
      <div class="mb-8">
        <label class="text-xs uppercase tracking-wider text-gray-500 mb-3 block">Атмосфера главы</label>
        <div class="grid grid-cols-2 gap-2">
          <button class="theme-btn active px-3 py-3 rounded-xl bg-violet-950/50 border border-violet-500/40 text-sm" data-theme="cosmic"><span class="block text-violet-300 mb-1">✦</span>Космос</button>
          <button class="theme-btn px-3 py-3 rounded-xl bg-white/5 border border-white/10 hover:border-blue-500/30 text-sm" data-theme="winter"><span class="block text-blue-300 mb-1">❄</span>Зима</button>
          <button class="theme-btn px-3 py-3 rounded-xl bg-white/5 border border-white/10 hover:border-orange-500/30 text-sm" data-theme="ember"><span class="block text-orange-300 mb-1">🔥</span>Пепел</button>
          <button class="theme-btn px-3 py-3 rounded-xl bg-white/5 border border-white/10 hover:border-emerald-500/30 text-sm" data-theme="mist"><span class="block text-emerald-300 mb-1">🌫</span>Туман</button>
        </div>
      </div>
      <div class="mb-8">
        <label class="text-xs uppercase tracking-wider text-gray-500 mb-3 block">Цвет фона</label>
        <div class="flex gap-2 flex-wrap">
          <button class="color-swatch w-9 h-9 rounded-full border-2 border-violet-400" style="background:#07060b" data-bg="#07060b"></button>
          <button class="color-swatch w-9 h-9 rounded-full border border-white/20" style="background:#0c0a14" data-bg="#0c0a14"></button>
          <button class="color-swatch w-9 h-9 rounded-full border border-white/20" style="background:#0a0f14" data-bg="#0a0f14"></button>
          <button class="color-swatch w-9 h-9 rounded-full border border-white/20" style="background:#0f0a0a" data-bg="#0f0a0a"></button>
          <button class="color-swatch w-9 h-9 rounded-full border border-white/20" style="background:#0a0f0c" data-bg="#0a0f0c"></button>
          <button class="color-swatch w-9 h-9 rounded-full border border-white/20" style="background:#12101a" data-bg="#12101a"></button>
        </div>
      </div>
      <div class="mb-8">
        <label class="text-xs uppercase tracking-wider text-gray-500 mb-3 block">Цвет текста</label>
        <div class="flex gap-2 flex-wrap">
          <button class="text-swatch w-9 h-9 rounded-full border-2 border-violet-400" style="background:#e8e4f0" data-text="#e8e4f0"></button>
          <button class="text-swatch w-9 h-9 rounded-full border border-white/20" style="background:#d4d0e0" data-text="#d4d0e0"></button>
          <button class="text-swatch w-9 h-9 rounded-full border border-white/20" style="background:#c8d4e0" data-text="#c8d4e0"></button>
          <button class="text-swatch w-9 h-9 rounded-full border border-white/20" style="background:#e0d4c8" data-text="#e0d4c8"></button>
          <button class="text-swatch w-9 h-9 rounded-full border border-white/20" style="background:#d0e0d4" data-text="#d0e0d4"></button>
        </div>
      </div>
      <div class="mb-8">
        <label class="text-xs uppercase tracking-wider text-gray-500 mb-3 block">Эффекты</label>
        <div class="space-y-3">
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm">Частицы / Снег / Дым</span>
            <input type="checkbox" id="toggle-particles" checked class="accent-violet-500 w-5 h-5">
          </label>
          <div class="flex items-center justify-between">
            <span class="text-sm">Интенсивность</span>
            <input type="range" id="particle-intensity" min="10" max="100" value="50" class="w-28 accent-violet-500">
          </div>
        </div>
      </div>
      <div class="mb-6">
        <label class="text-xs uppercase tracking-wider text-gray-500 mb-3 block">Межстрочный интервал</label>
        <input type="range" id="line-height" min="1.4" max="2.2" step="0.1" value="1.75" class="w-full accent-violet-500">
      </div>
    </div>
  </aside>

  <main id="reader-main" class="relative z-10 h-screen overflow-y-auto pt-16 pb-28 scroll-smooth">
    <article class="max-w-2xl mx-auto px-5 sm:px-6 py-10">
      <div class="text-center mb-14">
        <p class="text-violet-400/70 text-sm tracking-[0.25em] uppercase mb-3" id="chapter-number">Глава I</p>
        <h2 class="font-cinzel text-3xl sm:text-4xl md:text-5xl text-white mb-5 leading-tight" id="chapter-title">Пробуждение Эфира</h2>
        <div class="w-20 h-px bg-gradient-to-r from-transparent via-violet-500/50 to-transparent mx-auto"></div>
      </div>
      <div id="text-content" class="reader-text"></div>
      <div class="mt-16 pt-8 border-t border-white/10 flex items-center justify-between gap-4">
        <button id="prev-chapter" class="px-4 py-2.5 rounded-full border border-white/10 text-gray-500 text-sm disabled:opacity-40" disabled>← Назад</button>
        <div class="text-center">
          <p class="text-xs text-gray-600 mb-1"><span id="current-chapter-num">1</span> / 12</p>
          <div class="w-24 h-1 bg-white/10 rounded-full overflow-hidden">
            <div id="chapter-progress" class="h-full bg-violet-500/60 rounded-full transition-all" style="width: 8%"></div>
          </div>
        </div>
        <button id="next-chapter" class="px-4 py-2.5 rounded-full bg-violet-600/20 border border-violet-500/40 hover:bg-violet-600/30 text-violet-200 text-sm transition">Далее →</button>
      </div>
      <div class="mt-14 text-center">
        <p class="text-gray-600 text-sm" id="chapter-end-note">Конец главы</p>
      </div>
    </article>
  </main>

  <div id="progress-bar" class="fixed bottom-0 left-0 right-0 h-1 bg-white/5 z-40">
    <div id="progress-fill" class="h-full bg-gradient-to-r from-violet-600 to-purple-500 transition-all duration-150" style="width: 0%"></div>
  </div>

  <script src="js/reader.js"></script>
</body>
</html>
