<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Сияющий Дух Эфи Верховный</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Roboto+Slab:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-top:#030712; --bg-mid:#051525; --bg-bot:#0a1a2e;
  --text:#e0f2fe; --text-bright:1;
  --font-size:18px; --line-height:1.9; --font:'Lora',serif; --weight:400;
  --accent:#38bdf8; --align:left; --content-width:30rem;
  --band:28%;
  --edge:0.28;
  --text-prox:0.45;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--text);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 50%,var(--bg-bot) 100%);
  background-attachment:fixed;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.font-cinzel{font-family:Cinzel,serif}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
#atm-fx{position:fixed;inset:0;z-index:13;pointer-events:none}
#top-bar{transition:opacity .3s,transform .3s;z-index:40}
body.fullscreen #top-bar{opacity:0;pointer-events:none;transform:translateY(-100%)}
body.fullscreen.show-ui #top-bar{opacity:1;pointer-events:auto;transform:translateY(0)}
#settings-panel,#chapters-panel{transition:transform .28s cubic-bezier(.22,1,.36,1);z-index:50}
#settings-panel.open,#chapters-panel.open{transform:translateX(0)!important}
#settings-backdrop{opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#settings-backdrop.open{opacity:1;pointer-events:auto}
#main{
  position:relative;z-index:10;height:100%;
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;
  padding:3.4rem 0 5rem;
  background:transparent;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
#main::-webkit-scrollbar{display:none;width:0;height:0}
.reader-wrap{
  max-width:var(--content-width);
  margin:0 auto;
  padding:1.2rem 1.75rem 3rem;
  width:100%;
}
.spotlight{
  position:fixed;
  left:0;right:0;
  top:0;bottom:0;
  z-index:15;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    rgba(3,7,18,var(--edge)) 0%,
    rgba(3,7,18,var(--edge)) calc(50% - var(--band)/2 - 8%),
    transparent calc(50% - var(--band)/2),
    transparent calc(50% + var(--band)/2),
    rgba(3,7,18,var(--edge)) calc(50% + var(--band)/2 + 8%),
    rgba(3,7,18,var(--edge)) 100%
  );
}
.spotlight::after{
  content:'';
  position:absolute;left:0;right:0;
  top:calc(50% - 1px);height:2px;
  background:linear-gradient(90deg,transparent,rgba(56,189,248,.08),transparent);
  opacity:.6;
}
.reader-text{
  font-family:var(--font);
  font-size:var(--font-size);
  font-weight:var(--weight);
  line-height:var(--line-height);
  color:var(--text);
  text-align:var(--align);
  filter:brightness(var(--text-bright));
  position:relative;
  z-index:12;
}
.reader-text p{
  margin:0 0 1.15em;
  transform-origin:center center;
  will-change:transform,opacity;
}
.reader-text p.dropcap::first-letter{
  font-family:Cinzel,serif;
  font-size:1.45em;
  color:var(--accent);
  font-weight:600;
}
.c-red{color:#f87171;text-shadow:0 0 8px rgba(239,68,68,.35)}
.c-cyan{color:#22d3ee;text-shadow:0 0 8px rgba(6,182,212,.35)}
.c-green{color:#4ade80;text-shadow:0 0 8px rgba(34,197,94,.3)}
.c-gold{color:#fbbf24;text-shadow:0 0 8px rgba(245,158,11,.35)}
.c-purple{color:#c084fc;text-shadow:0 0 8px rgba(168,85,247,.35)}
.c-blue{color:#60a5fa;text-shadow:0 0 8px rgba(59,130,246,.3)}
.c-white{color:#f8fafc;text-shadow:0 0 10px rgba(255,255,255,.3)}
.c-black{color:#94a3b8}
.fx-moon{color:#f8fafc;text-shadow:0 0 14px #e0f2fe,0 0 24px #7dd3fc}
.fx-glow{color:#7dd3fc;text-shadow:0 0 12px #38bdf8}
.fx-blood{color:#f87171;text-shadow:0 0 10px #ef4444}
.fx-sand{color:#fbbf24;text-shadow:0 0 8px rgba(251,191,36,.45)}
.fx-shake{display:inline-block}
.mode-soft{--edge:0.55}
.mode-cinema{--band:18%;--edge:0.42}
.mode-cinema .reader-text{letter-spacing:.015em}
.mode-sharp{--edge:0.15;--band:40%}
.mode-sharp .reader-text{filter:brightness(var(--text-bright)) contrast(1.06)}
.mode-wide{--band:48%;--edge:0.22}
.mode-narrow{--band:14%;--edge:0.48}
.mode-float .reader-text p{animation:blockFloat 5s ease-in-out infinite}
@keyframes blockFloat{0%,100%{translate:0 0}50%{translate:0 -3px}}
.mode-breathe .reader-text{animation:blockBreathe 4s ease-in-out infinite}
@keyframes blockBreathe{0%,100%{opacity:1}50%{opacity:.88}}
.mode-pulse .spotlight{animation:bandPulse 3s ease-in-out infinite}
@keyframes bandPulse{0%,100%{opacity:1}50%{opacity:.85}}
.ch-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.4rem 0 0;margin-top:1.8rem;
  border-top:1px solid rgba(255,255,255,.06);
  position:relative;z-index:12;
}
.font-option.active,.theme-btn.active,.align-btn.active,.mode-btn.active{
  background:rgba(14,165,233,.22)!important;
  border-color:rgba(56,189,248,.5)!important;
}
.ch-item.active{
  border-color:rgba(56,189,248,.55)!important;
  background:rgba(14,165,233,.28)!important;
}
.ch-item.active span{color:#38bdf8!important}
.ch-item.active p{color:#fff!important}
.ch-item:not(.active) span{color:#64748b}
.ch-item:not(.active) p{color:#94a3b8}
input[type=range]{accent-color:#38bdf8}
input[type=color]{width:28px;height:22px;border:none;border-radius:4px;background:transparent;cursor:pointer;padding:0}
.color-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.color-row label{flex:1;font-size:11px;color:#94a3b8}
.section{border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:8px;margin-bottom:2px}
.section-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:6px 0;user-select:none}
.section-head h3{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin:0}
.section-body{display:none;padding-top:4px}
.section.open .section-body{display:block}
.section.open .chev{transform:rotate(180deg)}
.chev{transition:transform .2s;color:#64748b;font-size:10px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mode-btn{padding:7px 3px;border-radius:7px;border:1px solid rgba(255,255,255,.1);font-size:10px;text-align:center}
.fx-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.fx-row label{flex:1;font-size:12px}
</style>
</head>
<body>

<canvas id="atm-fx"></canvas>
<div class="spotlight" id="spotlight"></div>
<div id="settings-backdrop" class="fixed inset-0 bg-black/40"></div>
<header id="top-bar" class="fixed top-0 inset-x-0 bg-black/55 backdrop-blur-xl border-b border-white/5">
<div class="max-w-3xl mx-auto px-3 py-2 flex items-center justify-between">
<div class="flex items-center gap-2 min-w-0">
<a href="index.html" class="text-slate-400 hover:text-sky-300 text-sm shrink-0">←</a>
<div class="min-w-0">
<div class="font-cinzel text-sm text-white truncate">Сияющий Дух Эфи Верховный</div>
<div class="text-[10px] text-sky-400/80 truncate" id="ch-label">Глава I · Пробуждение Эфира</div>
</div></div>
<div class="flex items-center gap-0 shrink-0">
<button id="btn-ch" class="p-2 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white">☰</button>
<button id="btn-set" class="p-2 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white">⚙</button>
<button id="btn-fs" class="p-2 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white">⛶</button>
</div></div>
</header>
<aside id="chapters-panel" class="fixed top-0 left-0 h-full w-64 bg-[#071018]/97 backdrop-blur-2xl border-r border-sky-500/15 -translate-x-full overflow-y-auto">
<div class="p-4">
<div class="flex items-center justify-between mb-4">
<h2 class="font-cinzel text-base text-white">Главы</h2>
<button id="close-ch" class="text-slate-400 hover:text-white">✕</button>
</div>
<div class="space-y-1" id="ch-list">
<button class="ch-item active w-full text-left px-3 py-2.5 rounded-xl border border-sky-500/30 bg-sky-900/30" data-ch="1">
<span class="text-[10px] text-sky-400">Глава I</span>
<p class="text-sm text-white mt-0.5">Пробуждение Эфира</p>
</button>
<button class="ch-item w-full text-left px-3 py-2.5 rounded-xl border border-transparent hover:bg-white/5" data-ch="2">
<span class="text-[10px] text-slate-500">Глава II</span>
<p class="text-sm text-slate-300 mt-0.5">Первый Рассвет</p>
</button>
</div></div>
</aside>
<aside id="settings-panel" class="fixed top-0 right-0 h-full w-[19.5rem] max-w-[90vw] bg-[#071018]/97 backdrop-blur-2xl border-l border-sky-500/15 translate-x-full overflow-y-auto overscroll-contain">
<div class="p-3.5 pb-14">
<div class="flex items-center justify-between mb-1">
<h2 class="font-cinzel text-base text-white">Настройки</h2>
<button id="close-set" class="text-slate-400 hover:text-white p-1">✕</button>
</div>
<p class="text-[10px] text-slate-500 mb-2">Свайп / тап снаружи</p>
<div class="section open">
<div class="section-head"><h3>Текст</h3><span class="chev">▼</span></div>
<div class="section-body space-y-2">
<div>
<label class="text-[10px] text-slate-500 mb-0.5 block">Размер</label>
<div class="flex items-center gap-1.5">
<button id="fs-down" class="w-6 h-6 rounded bg-white/5 text-[10px]">A−</button>
<input type="range" id="fs" min="15" max="24" value="18" class="flex-1">
<button id="fs-up" class="w-6 h-6 rounded bg-white/5 text-[10px]">A+</button>
</div></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Жирность</label>
<input type="range" id="weight" min="300" max="700" step="100" value="400" class="w-full"></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Межстрочный</label>
<input type="range" id="lh" min="1.4" max="2.3" step="0.05" value="1.9" class="w-full"></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Ширина колонки</label>
<input type="range" id="width" min="16" max="36" value="30" class="w-full"></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Выравнивание</label>
<div class="flex gap-1">
<button class="align-btn active flex-1 py-1 rounded-lg border border-sky-500/40 text-[10px]" data-a="left">Слева</button>
<button class="align-btn flex-1 py-1 rounded-lg border border-white/10 text-[10px]" data-a="center">Центр</button>
<button class="align-btn flex-1 py-1 rounded-lg border border-white/10 text-[10px]" data-a="justify">Ширина</button>
</div></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Цвет / яркость</label>
<div class="flex items-center gap-2">
<input type="color" id="text-color" value="#e0f2fe">
<input type="range" id="text-bright" min="0.55" max="1.3" step="0.05" value="1" class="flex-1">
</div></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Приближение от центра</label>
<input type="range" id="text-prox" min="0" max="100" value="45" class="w-full"></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Шрифт</label>
<div class="space-y-0.5 max-h-20 overflow-y-auto" id="font-list"></div></div>
</div></div>
<div class="section">
<div class="section-head"><h3>Режимы чтения</h3><span class="chev">▼</span></div>
<div class="section-body space-y-2">
<div class="mode-grid">
<button class="mode-btn active" data-m="still">Покой</button>
<button class="mode-btn" data-m="soft">Мягкий</button>
<button class="mode-btn" data-m="cinema">Кино</button>
<button class="mode-btn" data-m="sharp">Чёткий</button>
<button class="mode-btn" data-m="wide">Широкий</button>
<button class="mode-btn" data-m="narrow">Узкий</button>
<button class="mode-btn" data-m="float">Парение</button>
<button class="mode-btn" data-m="breathe">Дыхание</button>
<button class="mode-btn" data-m="pulse">Пульс</button>
</div>
<div>
<label class="text-[10px] text-slate-500 mb-0.5 block">Высота светлой зоны</label>
<input type="range" id="band" min="10" max="55" value="28" class="w-full">
</div>
<div>
<label class="text-[10px] text-slate-500 mb-0.5 block">Затемнение краёв</label>
<input type="range" id="edge" min="0" max="70" value="28" class="w-full">
</div>
<label class="flex items-center justify-between text-xs cursor-pointer">
<span>Центральная подсветка</span>
<input type="checkbox" id="spot-on" checked class="w-3.5 h-3.5 accent-sky-400">
</label>
</div></div>
<div class="section">
<div class="section-head"><h3>Атмосфера фона</h3><span class="chev">▼</span></div>
<div class="section-body space-y-2">
<div class="color-row"><label>Верх</label><input type="color" id="bg-top" value="#030712"></div>
<div class="color-row"><label>Середина</label><input type="color" id="bg-mid" value="#051525"></div>
<div class="color-row"><label>Низ</label><input type="color" id="bg-bot" value="#0a1a2e"></div>
<div class="grid grid-cols-3 gap-1">
<button class="theme-btn active px-1 py-1 rounded-lg border border-sky-500/40 text-[9px]" data-theme="flame">Пламя</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="cosmic">Космос</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="winter">Лёд</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="ember">Рассвет</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="mist">Туман</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="void">Пустота</button>
</div>
<label class="flex items-center justify-between text-xs cursor-pointer">
<span>Авто по главам</span>
<input type="checkbox" id="auto-theme" checked class="w-3.5 h-3.5 accent-sky-400">
</label>
</div></div>
<div class="section">
<div class="section-head"><h3>Эффекты над текстом</h3><span class="chev">▼</span></div>
<div class="section-body space-y-1">
<div class="fx-row"><input type="checkbox" id="atm-snow" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-snow">Снег / звёзды</label><input type="color" id="col-snow" value="#e2e8f0"><input type="range" id="int-snow" min="0" max="100" value="55" class="w-16"></div>
<div class="fx-row"><input type="checkbox" id="atm-embers" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-embers">Искры</label><input type="color" id="col-embers" value="#f97316"><input type="range" id="int-embers" min="0" max="100" value="50" class="w-16"></div>
<div class="fx-row"><input type="checkbox" id="atm-smoke" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-smoke">Дым</label><input type="color" id="col-smoke" value="#475569"><input type="range" id="int-smoke" min="0" max="100" value="45" class="w-16"></div>
<div class="fx-row"><input type="checkbox" id="atm-fog" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-fog">Туман</label><input type="color" id="col-fog" value="#94a3b8"><input type="range" id="int-fog" min="0" max="100" value="40" class="w-16"></div>
<div class="fx-row"><input type="checkbox" id="atm-orbs" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-orbs">Светящиеся сферы</label><input type="color" id="col-orbs" value="#bae6fd"><input type="range" id="int-orbs" min="0" max="100" value="40" class="w-16"></div>
<div class="fx-row"><input type="checkbox" id="atm-ash" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-ash">Пепел</label><input type="color" id="col-ash" value="#a1a1aa"><input type="range" id="int-ash" min="0" max="100" value="35" class="w-16"></div>
</div></div>
<div class="section">
<div class="section-head"><h3>Частицы фона</h3><span class="chev">▼</span></div>
<div class="section-body space-y-2">
<label class="flex items-center justify-between text-xs cursor-pointer">
<span>Включены</span>
<input type="checkbox" id="particles" checked class="w-3.5 h-3.5 accent-sky-400">
</label>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Интенсивность</label>
<input type="range" id="intensity" min="0" max="35" value="12" class="w-full"></div>
<div class="flex items-center gap-2">
<input type="color" id="part-color" value="#38bdf8">
<div class="flex gap-1">
<button class="w-4 h-4 rounded-full bg-sky-400 border border-white/20" data-c="#38bdf8"></button>
<button class="w-4 h-4 rounded-full bg-cyan-300 border border-white/20" data-c="#67e8f9"></button>
<button class="w-4 h-4 rounded-full bg-amber-400 border border-white/20" data-c="#fbbf24"></button>
</div></div>
</div></div>
</div>
</aside>
<main id="main">
<div class="reader-wrap" id="reader-root">
<div class="text-center mb-7">
<p class="text-sky-400/70 text-xs tracking-[0.16em] uppercase mb-1.5" id="ch-num">Глава I</p>
<h2 class="font-cinzel text-2xl sm:text-3xl text-white mb-2" id="ch-title">Пробуждение Эфира</h2>
<div class="w-10 h-px bg-gradient-to-r from-transparent via-sky-400/40 to-transparent mx-auto"></div>
</div>
<div id="content" class="reader-text"></div>
<div class="ch-nav">
<button id="prev" class="px-3 py-1.5 rounded-full border border-white/10 text-xs text-slate-500 disabled:opacity-25" disabled>← Назад</button>
<span class="text-[10px] text-slate-500"><span id="cur">1</span> / 2</span>
<button id="next" class="px-3 py-1.5 rounded-full bg-sky-600/25 border border-sky-400/35 text-sky-200 text-xs">Далее →</button>
</div>
</div>
</main>
<script>

const chapters={1:{num:"Глава I",title:"Пробуждение Эфира",theme:"flame",html:`\n<p class=\"dropcap\">Эфир заполнял поднебесье.</p>\n<p>Оно было настолько безграничным, что мы сами казались карликами в этом титаническом мире.</p>\n<p>Мир, в котором <span class=\"fx-moon\">белая Луна</span> не была одинока.</p>\n<p>Рядом с ней было ещё десять таких же огромных соседей.</p>\n<p>И все они отличались по цвету.</p>\n<p>Каждая из них была настолько великолепна и велика, что казалось — каждая из них не просто светится.</p>\n<p>А распространяет свою ауру по поверхности этой планеты.</p>\n<p>Для которой даже такие махины были карликами.</p>\n<p>Но это было не всё.</p>\n<p>Кроме десяти главных были сотни и тысячи поменьше.</p>\n<p>И многие из них уже были не одного конкретного цвета, а связью двух, трёх и более цветов.</p>\n<p>Из-за чего это ночное время казалось скорее не временем тишины и покоя, а <span class=\"fx-glow\">церемониальным</span>.</p>\n<p>Словно на тебя смотрят миллионы чьих-то глаз, оценивающих — достоин ты, или нет.</p>\n<p>Кто-то с жаждой <span class=\"fx-blood\">убийства</span>.</p>\n<p>Кто-то с интересом или пренебрежением.</p>\n<p>Словно для кого-то это всё игра и забава, а для иных — нечто серьёзное.</p>\n<p>И именно такую нешуточную и опасную ауру имела главная <span class=\"fx-moon\">белая Луна</span>.</p>\n<p>Но медленно, несмотря на масштабы самого титанического мира из возможных, луны ушли за горизонт.</p>\n<p>Их свет сменился сотнями тысяч солнечных.</p>\n<p>В той же системе — десять главных, у каждого свой цвет, и миллионы по убыванию в размере, с разной палитрой цветов.</p>\n<p style=\"color:#fde68a;font-style:italic\">Лунный свет сменился солнечным.</p>\n<p>Первые лучи коснулись вершин далёких хребтов.</p>\n<p>И мир на мгновение замер — будто сам эфир затаил дыхание.</p>\n<p>Воздух стал плотнее, тяжелее.</p>\n<p>В нём появился вкус металла и чего-то древнего, почти забытого.</p>\n<p>Там, где ещё мгновение назад царила церемониальная тьма, теперь разливалось мягкое, но неотвратимое сияние.</p>\n<p>Оно не было похоже на обычный рассвет.</p>\n<p>Оно было <em>осознанным</em>.</p>\n<p>Я стоял на краю обсидиановой платформы и смотрел, как десять новых светил поднимаются над горизонтом один за другим — каждый своего оттенка.</p>\n<p>Кроваво-красный. Холодный бирюзовый. Ядовито-зелёный.</p>\n<p>Золотой, почти ослепительный. Фиолетовый, будто сгусток самой ночи.</p>\n<p>И где-то между ними — едва заметная, почти прозрачная — та, что светила мягче всех.</p>\n<p>Та, что смотрела прямо на меня.</p>\n<p>Под ногами хрустел чёрный <span class=\"fx-sand\">песок</span>.</p>\n<p>Каждый шаг оставлял след, который медленно затягивался, будто поверхность дышала.</p>\n`},2:{num:"Глава II",title:"Первый Рассвет",theme:"ember",html:`\n<p class=\"dropcap\">Свет не просто осветил мир — он <span class=\"fx-shake\">изменил</span> его.</p>\n<p>Там, где раньше лежала холодная тьма, теперь ползли длинные тени.</p>\n<p>Они были живыми.</p>\n<p>Двигались не так, как должны двигаться тени от солнца.</p>\n<p>Они тянулись к источникам света, словно хотели поглотить их.</p>\n<p style=\"color:#fde68a;font-style:italic\">Один из красных солнец вспыхнул ярче.</p>\n<p style=\"color:#fde68a;font-style:italic\">На секунду весь горизонт окрасился в цвет <span class=\"fx-blood\">крови</span> и раскалённого металла.</p>\n<p>Я почувствовал тепло на коже. Настоящее, обжигающее.</p>\n<p>Эфир вокруг начал дрожать — мелкая вибрация, которую скорее чувствуешь костями, чем слышишь.</p>\n<p>Где-то далеко, за линией хребтов, что-то огромное медленно поднялось.</p>\n<p>Слишком большое, чтобы быть живым существом.</p>\n<p>Слишком правильное, чтобы быть горой.</p>\n<p>И в этот момент я понял: рассвет здесь — не начало дня.</p>\n<p>Это начало охоты.</p>\n<p><span class=\"fx-moon\">Белая Луна</span>, даже уйдя за горизонт, всё ещё смотрела.</p>\n<p>Я чувствовал её взгляд затылком.</p>\n`}};

/* ===== Center depth (scale + soft opacity like spotlight) ===== */
let proxStrength = 0.45;
let depthParas = [];
let depthRaf = 0;

function collectParas(){
  depthParas = Array.from(document.querySelectorAll('#content p'));
}

function updateDepth(){
  depthRaf = 0;
  const n = depthParas.length;
  if(!n) return;
  const cy = window.innerHeight * 0.5;
  const maxDist = window.innerHeight * 0.42;
  const strength = proxStrength;
  const sMin = 1 - 0.07 * strength;
  const sMax = 1 + 0.11 * strength;
  const oMin = 1 - 0.35 * strength;
  const oMax = 1;

  for(let i=0;i<n;i++){
    const p = depthParas[i];
    const r = p.getBoundingClientRect();
    if(r.bottom < -80 || r.top > window.innerHeight + 80){
      p.style.transform = 'scale(' + sMin.toFixed(4) + ')';
      p.style.opacity = oMin.toFixed(3);
      continue;
    }
    const mid = r.top + r.height * 0.5;
    let t = 1 - Math.abs(mid - cy) / maxDist;
    if(t < 0) t = 0;
    t = t * t * (3 - 2 * t);
    const sc = sMin + (sMax - sMin) * t;
    const op = oMin + (oMax - oMin) * t;
    p.style.transform = 'scale(' + sc.toFixed(4) + ')';
    p.style.opacity = op.toFixed(3);
  }
}

function requestDepth(){
  if(!depthRaf) depthRaf = requestAnimationFrame(updateDepth);
}

document.getElementById('text-prox').oninput = e => {
  proxStrength = (+e.target.value) / 100;
  document.documentElement.style.setProperty('--text-prox', proxStrength.toFixed(3));
  requestDepth();
};

const mainEl = document.getElementById('main');
mainEl.addEventListener('scroll', requestDepth, {passive:true});
addEventListener('resize', () => { requestDepth(); });

document.getElementById('edge').oninput=e=>{document.documentElement.style.setProperty('--edge',(+e.target.value/100).toFixed(2))};
document.getElementById('spot-on').onchange=e=>{document.getElementById('spotlight').style.display=e.target.checked?'':'none'};

document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');applyMode(b.dataset.m)});
function updateCustomBg(){applyGradient(document.getElementById('bg-top').value,document.getElementById('bg-mid').value,document.getElementById('bg-bot').value);autoTheme=false;document.getElementById('auto-theme').checked=false;document.querySelectorAll('.theme-btn').forEach(x=>x.classList.remove('active'))}

document.getElementById('part-color').oninput=e=>{const hex=e.target.value;partColor={r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)}};

['snow','embers','smoke','fog','orbs','ash'].forEach(type=>{document.getElementById('atm-'+type).onchange=e=>{atm[type]=e.target.checked;initAtm()};document.getElementById('col-'+type).oninput=e=>{atmCol[type]=e.target.value};document.getElementById('int-'+type).oninput=e=>{atmInt[type]=+e.target.value;initAtm()}});
document.getElementById('prev').onclick=()=>{if(cur>1)load(cur-1)};document.getElementById('next').onclick=()=>{if(chapters[cur+1])load(cur+1)};
document.querySelectorAll('.ch-item').forEach(b=>b.onclick=()=>{load(+b.dataset.ch);document.getElementById('chapters-panel').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSet();document.getElementById('chapters-panel').classList.remove('open');if(document.fullscreenElement)document.exitFullscreen()}if((e.key==='f'||e.key==='а')&&!e.ctrlKey)document.getElementById('btn-fs').click();if(e.key==='ArrowRight'&&chapters[cur+1])load(cur+1);if(e.key==='ArrowLeft'&&cur>1)load(cur-1)});
resize();setTheme('flame');applyMode('still');load(1);loop();requestDepth();
addEventListener('resize',resize);
</script>
