<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Сияющий Дух Эфи Верховный</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Roboto+Slab:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-top:#030712;--bg-mid:#030712;--bg-bot:#030712;--text:#e0f2fe;--text-bright:1;--font-size:19px;--line-height:1.9;--font:'Lora',serif;--weight:400;--accent:#38bdf8;--align:left;--content-width:34rem;--focus-str:1.16}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:transparent;overscroll-behavior:none}
body{height:100%;font-family:Inter,system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 50%,var(--bg-bot) 100%);background-attachment:fixed;transition:background 1.2s ease;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.font-cinzel{font-family:Cinzel,serif}#fx,#atm-fx{position:fixed;inset:0;z-index:0;pointer-events:none}#atm-fx{z-index:5}
#top-bar{transition:opacity .35s,transform .35s}body.fullscreen #top-bar{opacity:0;pointer-events:none;transform:translateY(-100%)}body.fullscreen.show-ui #top-bar{opacity:1;pointer-events:auto;transform:translateY(0)}
#settings-panel,#chapters-panel{transition:transform .28s cubic-bezier(.22,1,.36,1)}#settings-panel.open{transform:translateX(0)!important}#chapters-panel.open{transform:translateX(0)!important}
#settings-backdrop{opacity:0;pointer-events:none;transition:opacity .25s}#settings-backdrop.open{opacity:1;pointer-events:auto}
#main{position:relative;z-index:10;height:100%;overflow-y:auto;overflow-x:hidden;background:transparent!important;overscroll-behavior:none;-webkit-overflow-scrolling:touch;padding-top:3.2rem;padding-bottom:5rem}
.reader-wrap{max-width:var(--content-width);margin:0 auto;padding:1.5rem 1.4rem 4rem;width:100%;overflow:hidden;background:transparent}
.reader-text{font-family:var(--font);font-size:var(--font-size);font-weight:var(--weight);line-height:var(--line-height);color:var(--text);text-align:var(--align);filter:brightness(var(--text-bright));word-wrap:break-word;overflow-wrap:anywhere;hyphens:auto;background:transparent}
.reader-text .ph{display:inline-block;transform-origin:center center;will-change:transform,opacity;transition:none;opacity:.34;transform:scale(0.94);vertical-align:baseline;padding:0 .04em;max-width:100%}
.reader-text .ph.focus{opacity:1}
.reader-text p{margin:0 0 1.45em;background:transparent;overflow:hidden}
.reader-text p:first-of-type::first-letter{font-family:Cinzel,serif;font-size:2.85em;float:left;line-height:.82;padding-right:.06em;color:var(--accent);font-weight:600}
.c-red{color:#f87171!important;text-shadow:0 0 8px rgba(239,68,68,.45)}.c-cyan{color:#22d3ee!important;text-shadow:0 0 8px rgba(6,182,212,.45)}.c-green{color:#4ade80!important;text-shadow:0 0 8px rgba(34,197,94,.4)}.c-gold{color:#fbbf24!important;text-shadow:0 0 8px rgba(245,158,11,.45)}.c-purple{color:#c084fc!important;text-shadow:0 0 8px rgba(168,85,247,.45)}.c-blue{color:#60a5fa!important;text-shadow:0 0 8px rgba(59,130,246,.4)}.c-white{color:#f8fafc!important;text-shadow:0 0 10px rgba(255,255,255,.4)}.c-black{color:#94a3b8!important}
.fx-moon{color:#f8fafc;text-shadow:0 0 12px #e0f2fe,0 0 22px #7dd3fc;transition:text-shadow .5s}.fx-moon.on{text-shadow:0 0 16px #e0f2fe,0 0 28px #bae6fd,0 0 40px #7dd3fc}
.fx-glow{transition:color .45s,text-shadow .45s}.fx-glow.on{color:#7dd3fc;text-shadow:0 0 12px #38bdf8}
.fx-blood{transition:color .45s,text-shadow .45s}.fx-blood.on{color:#f87171;text-shadow:0 0 10px #ef4444}
.fx-sand{transition:color .5s,text-shadow .5s}.fx-sand.on{color:#fbbf24;text-shadow:0 0 8px rgba(251,191,36,.55)}
.fx-shake.on{animation:shake .4s ease-in-out}@keyframes shake{0%,100%{transform:translateX(0)}40%{transform:translateX(-1.5px)}60%{transform:translateX(1.5px)}}
.mode-float .ph.focus{animation:floatY 4.5s ease-in-out infinite}@keyframes floatY{0%,100%{transform:scale(var(--sc,1.12)) translateY(0)}50%{transform:scale(var(--sc,1.12)) translateY(-2.5px)}}
.mode-breathe .ph.focus{animation:breathe 3.5s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(var(--sc,1.12))}50%{transform:scale(calc(var(--sc,1.12)*1.025))}}
.mode-soft .ph:not(.focus){filter:blur(.55px);opacity:.22!important}
.mode-cinema .ph.focus{text-shadow:0 0 16px rgba(56,189,248,.16);letter-spacing:.012em}
.mode-sharp .ph.focus{filter:contrast(1.1) brightness(1.05)}
.mode-pulse .ph.focus{animation:pulseG 2.2s ease-in-out infinite}@keyframes pulseG{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.mode-drift .ph.focus{animation:driftX 6s ease-in-out infinite}@keyframes driftX{0%,100%{transform:scale(var(--sc,1.12)) translateX(0)}50%{transform:scale(var(--sc,1.12)) translateX(1.5px)}}
.ch-nav{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 0 0;margin-top:1.5rem;border-top:1px solid rgba(255,255,255,.06);background:transparent!important}
.ch-nav button,.ch-nav span{background:transparent}
.font-option.active,.theme-btn.active,.align-btn.active,.mode-btn.active{background:rgba(14,165,233,.2)!important;border-color:rgba(56,189,248,.45)!important}
input[type=range]{accent-color:#38bdf8}input[type=color]{width:28px;height:22px;border:none;border-radius:4px;background:transparent;cursor:pointer;padding:0}
.color-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}.color-row label{flex:1;font-size:11px;color:#94a3b8}
.section{border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:8px;margin-bottom:2px}
.section-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:6px 0;user-select:none}
.section-head h3{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin:0}
.section-body{display:none;padding-top:4px}.section.open .section-body{display:block}.section.open .chev{transform:rotate(180deg)}.chev{transition:transform .2s;color:#64748b;font-size:10px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.mode-btn{padding:6px 3px;border-radius:7px;border:1px solid rgba(255,255,255,.1);font-size:10px;text-align:center}
.fx-row{display:flex;align-items:center;gap:8px;padding:4px 0}.fx-row label{flex:1;font-size:12px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<canvas id="atm-fx"></canvas>
<div id="settings-backdrop" class="fixed inset-0 bg-black/40 z-40"></div>
<header id="top-bar" class="fixed top-0 inset-x-0 z-40 bg-black/55 backdrop-blur-xl border-b border-white/5">
<div class="max-w-3xl mx-auto px-3 py-2 flex items-center justify-between">
<div class="flex items-center gap-2 min-w-0"><a href="index.html" class="text-slate-400 hover:text-sky-300 text-sm shrink-0">←</a>
<div class="min-w-0"><div class="font-cinzel text-sm text-white truncate">Сияющий Дух Эфи Верховный</div>
<div class="text-[10px] text-sky-400/80 truncate" id="ch-label">Глава I · Пробуждение Эфира</div></div></div>
<div class="flex items-center gap-0 shrink-0">
<button id="btn-ch" class="p-2 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white text-base">☰</button>
<button id="btn-set" class="p-2 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white text-base">⚙</button>
<button id="btn-fs" class="p-2 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white text-base">⛶</button>
</div></div></header>
<aside id="chapters-panel" class="fixed top-0 left-0 h-full w-64 bg-[#071018]/97 backdrop-blur-2xl border-r border-sky-500/15 z-50 -translate-x-full overflow-y-auto">
<div class="p-4"><div class="flex items-center justify-between mb-4"><h2 class="font-cinzel text-base text-white">Главы</h2><button id="close-ch" class="text-slate-400 hover:text-white">✕</button></div>
<div class="space-y-1">
<button class="ch-item active w-full text-left px-3 py-2.5 rounded-xl border border-sky-500/30 bg-sky-900/30" data-ch="1"><span class="text-[10px] text-sky-400">Глава I</span><p class="text-sm text-white mt-0.5">Пробуждение Эфира</p></button>
<button class="ch-item w-full text-left px-3 py-2.5 rounded-xl border border-transparent hover:bg-white/5" data-ch="2"><span class="text-[10px] text-slate-500">Глава II</span><p class="text-sm text-slate-300 mt-0.5">Первый Рассвет</p></button>
</div></div></aside>
<aside id="settings-panel" class="fixed top-0 right-0 h-full w-[19.5rem] max-w-[90vw] bg-[#071018]/97 backdrop-blur-2xl border-l border-sky-500/15 z-50 translate-x-full overflow-y-auto overscroll-contain">
<div class="p-3.5 pb-14">
<div class="flex items-center justify-between mb-1"><h2 class="font-cinzel text-base text-white">Настройки</h2><button id="close-set" class="text-slate-400 hover:text-white p-1">✕</button></div>
<p class="text-[10px] text-slate-500 mb-2">Свайп / тап снаружи</p>
<div class="section open"><div class="section-head"><h3>Текст</h3><span class="chev">▼</span></div>
<div class="section-body space-y-2">
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Размер</label><div class="flex items-center gap-1.5"><button id="fs-down" class="w-6 h-6 rounded bg-white/5 text-[10px]">A−</button><input type="range" id="fs" min="15" max="26" value="19" class="flex-1"><button id="fs-up" class="w-6 h-6 rounded bg-white/5 text-[10px]">A+</button></div></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Жирность</label><input type="range" id="weight" min="300" max="700" step="100" value="400" class="w-full"></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Межстрочный</label><input type="range" id="lh" min="1.4" max="2.2" step="0.05" value="1.9" class="w-full"></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Ширина</label><input type="range" id="width" min="16" max="40" value="34" class="w-full"></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Выравнивание</label><div class="flex gap-1"><button class="align-btn active flex-1 py-1 rounded-lg border border-sky-500/40 text-[10px]" data-a="left">Слева</button><button class="align-btn flex-1 py-1 rounded-lg border border-white/10 text-[10px]" data-a="center">Центр</button><button class="align-btn flex-1 py-1 rounded-lg border border-white/10 text-[10px]" data-a="justify">Ширина</button></div></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Цвет / яркость</label><div class="flex items-center gap-2"><input type="color" id="text-color" value="#e0f2fe"><input type="range" id="text-bright" min="0.55" max="1.3" step="0.05" value="1" class="flex-1"></div></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Шрифт</label><div class="space-y-0.5 max-h-20 overflow-y-auto" id="font-list"></div></div>
</div></div>
<div class="section"><div class="section-head"><h3>Режимы</h3><span class="chev">▼</span></div>
<div class="section-body space-y-2">
<div class="mode-grid">
<button class="mode-btn active" data-m="still">Покой</button>
<button class="mode-btn" data-m="float">Парение</button>
<button class="mode-btn" data-m="breathe">Дыхание</button>
<button class="mode-btn" data-m="soft">Мягкий</button>
<button class="mode-btn" data-m="cinema">Кино</button>
<button class="mode-btn" data-m="sharp">Чёткость</button>
<button class="mode-btn" data-m="pulse">Пульс</button>
<button class="mode-btn" data-m="drift">Дрейф</button>
</div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Сила приближения</label><input type="range" id="focus-str" min="1.04" max="1.24" step="0.01" value="1.16" class="w-full"></div>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Ширина зоны фокуса</label><input type="range" id="zone" min="0.14" max="0.45" step="0.01" value="0.26" class="w-full"></div>
<label class="flex items-center justify-between text-xs cursor-pointer"><span>Плавный фокус (2–3 слова)</span><input type="checkbox" id="focus-mode" checked class="w-3.5 h-3.5 accent-sky-400"></label>
</div></div>
<div class="section"><div class="section-head"><h3>Атмосфера фона</h3><span class="chev">▼</span></div>
<div class="section-body space-y-2">
<div class="color-row"><label>Верх</label><input type="color" id="bg-top" value="#030712"></div>
<div class="color-row"><label>Середина</label><input type="color" id="bg-mid" value="#030712"></div>
<div class="color-row"><label>Низ</label><input type="color" id="bg-bot" value="#030712"></div>
<div class="grid grid-cols-3 gap-1">
<button class="theme-btn active px-1 py-1 rounded-lg border border-sky-500/40 text-[9px]" data-theme="flame">Пламя</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="cosmic">Космос</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="winter">Лёд</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="ember">Рассвет</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="mist">Туман</button>
<button class="theme-btn px-1 py-1 rounded-lg border border-white/10 text-[9px]" data-theme="void">Пустота</button>
</div>
<label class="flex items-center justify-between text-xs cursor-pointer"><span>Авто по главам</span><input type="checkbox" id="auto-theme" checked class="w-3.5 h-3.5 accent-sky-400"></label>
</div></div>
<div class="section"><div class="section-head"><h3>Эффекты над текстом</h3><span class="chev">▼</span></div>
<div class="section-body space-y-1">
<div class="fx-row"><input type="checkbox" id="atm-smoke" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-smoke">Дым</label><input type="color" id="col-smoke" value="#64748b"><input type="range" id="int-smoke" min="0" max="100" value="40" class="w-16"></div>
<div class="fx-row"><input type="checkbox" id="atm-fog" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-fog">Туман</label><input type="color" id="col-fog" value="#94a3b8"><input type="range" id="int-fog" min="0" max="100" value="35" class="w-16"></div>
<div class="fx-row"><input type="checkbox" id="atm-embers" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-embers">Искры</label><input type="color" id="col-embers" value="#f97316"><input type="range" id="int-embers" min="0" max="100" value="30" class="w-16"></div>
<div class="fx-row"><input type="checkbox" id="atm-ash" class="w-3.5 h-3.5 accent-sky-400"><label for="atm-ash">Пепел</label><input type="color" id="col-ash" value="#a1a1aa"><input type="range" id="int-ash" min="0" max="100" value="25" class="w-16"></div>
</div></div>
<div class="section"><div class="section-head"><h3>Частицы фона</h3><span class="chev">▼</span></div>
<div class="section-body space-y-2">
<label class="flex items-center justify-between text-xs cursor-pointer"><span>Включены</span><input type="checkbox" id="particles" checked class="w-3.5 h-3.5 accent-sky-400"></label>
<div><label class="text-[10px] text-slate-500 mb-0.5 block">Интенсивность</label><input type="range" id="intensity" min="0" max="35" value="14" class="w-full"></div>
<div class="flex items-center gap-2"><input type="color" id="part-color" value="#38bdf8"><div class="flex gap-1"><button class="w-4 h-4 rounded-full bg-sky-400 border border-white/20" data-c="#38bdf8"></button><button class="w-4 h-4 rounded-full bg-cyan-300 border border-white/20" data-c="#67e8f9"></button><button class="w-4 h-4 rounded-full bg-amber-400 border border-white/20" data-c="#fbbf24"></button></div></div>
<label class="flex items-center justify-between text-xs cursor-pointer"><span>Цвета и эффекты слов</span><input type="checkbox" id="word-fx" checked class="w-3.5 h-3.5 accent-sky-400"></label>
</div></div>
</div></aside>
<main id="main">
<div class="reader-wrap">
<div class="text-center mb-8"><p class="text-sky-400/70 text-xs tracking-[0.16em] uppercase mb-1.5" id="ch-num">Глава I</p>
<h2 class="font-cinzel text-2xl sm:text-3xl text-white mb-2" id="ch-title">Пробуждение Эфира</h2>
<div class="w-10 h-px bg-gradient-to-r from-transparent via-sky-400/40 to-transparent mx-auto"></div></div>
<div id="content" class="reader-text"></div>
<div class="ch-nav">
<button id="prev" class="px-3 py-1.5 rounded-full border border-white/10 text-xs text-slate-500 disabled:opacity-25" disabled>← Назад</button>
<span class="text-[10px] text-slate-500"><span id="cur">1</span> / 2</span>
<button id="next" class="px-3 py-1.5 rounded-full bg-sky-600/25 border border-sky-400/35 text-sky-200 text-xs">Далее →</button>
</div></div></main>
<script>
const FONTS=[{name:'Lora',val:"'Lora',serif"},{name:'Merriweather',val:"'Merriweather',serif"},{name:'Playfair',val:"'Playfair Display',serif"},{name:'Cormorant',val:"'Cormorant Garamond',serif"},{name:'EB Garamond',val:"'EB Garamond',serif"},{name:'Literata',val:"'Literata',serif"},{name:'Source Serif',val:"'Source Serif 4',serif"},{name:'Crimson Pro',val:"'Crimson Pro',serif"},{name:'Spectral',val:"'Spectral',serif"},{name:'PT Serif',val:"'PT Serif',serif"},{name:'Noto Serif',val:"'Noto Serif',serif"},{name:'Roboto Slab',val:"'Roboto Slab',serif"},{name:'Cinzel',val:"'Cinzel',serif"},{name:'Inter',val:"'Inter',sans-serif"}];
const PRESETS={flame:{top:'#030712',mid:'#051525',bot:'#0a1a2e'},cosmic:{top:'#020617',mid:'#0c1222',bot:'#111827'},winter:{top:'#0a1219',mid:'#0f1c28',bot:'#132433'},ember:{top:'#120a06',mid:'#1c1008',bot:'#27180c'},mist:{top:'#061214',mid:'#0a1a1c',bot:'#0e2224'},void:{top:'#020204',mid:'#050508',bot:'#0a0a0f'}};
const COLOR_WORDS=[{re:/\b(кроваво-красн\w*|красн\w*)\b/gi,cls:'c-red'},{re:/\b(бирюзов\w*|голуб\w*)\b/gi,cls:'c-cyan'},{re:/\b(ядовито-зелён\w*|зелён\w*)\b/gi,cls:'c-green'},{re:/\b(золот\w*|жёлт\w*)\b/gi,cls:'c-gold'},{re:/\b(фиолетов\w*|лилов\w*)\b/gi,cls:'c-purple'},{re:/\b(син\w*)\b/gi,cls:'c-blue'},{re:/\b(бел\w*)\b/gi,cls:'c-white'},{re:/\b(чёрн\w*)\b/gi,cls:'c-black'}];
const chapters={1:{num:"Глава I",title:"Пробуждение Эфира",theme:"flame",html:`<p>Эфир заполнял поднебесье. Оно было настолько безграничным, что мы сами казались карликами в этом титаническом мире.</p>\n<p>Мир, в котором <span class=\"fx-moon\">белая Луна</span> не была одинока, рядом с ней было ещё десять таких же огромных соседей, и все они отличались по цвету и каждая из них была настолько великолепна и велика, что казалось — каждая из них не просто светится, а распространяет свою ауру по поверхности этой планеты, для которой даже такие махины были карликами.</p>\n<p>Но это было не всё. Кроме десяти главных были сотни и тысячи поменьше, и многие из них уже были не одного конкретного цвета, а связью двух, трёх и более цветов.</p>\n<p>Из-за чего это ночное время казалось скорее не временем тишины и покоя, а <span class=\"fx-glow\">церемониальным</span>. Словно на тебя смотрят миллионы чьих-то глаз, оценивающих — достоин ты, или нет.</p>\n<p>Кто-то с жаждой <span class=\"fx-blood\">убийства</span>. Кто-то с интересом или пренебрежением. Словно для кого-то это всё игра и забава, а для иных — нечто серьёзное. И именно такую нешуточную и опасную ауру имела главная <span class=\"fx-moon\">белая Луна</span>.</p>\n<p>Но медленно, несмотря на масштабы самого титанического мира из возможных, луны ушли за горизонт. Их свет сменился сотнями тысяч солнечных. В той же системе — десять главных, у каждого свой цвет, и миллионы по убыванию в размере, с разной палитрой цветов.</p>\n<p style=\"color:#fde68a;font-style:italic\">Лунный свет сменился солнечным.</p>\n<p>Первые лучи коснулись вершин далёких хребтов, и мир на мгновение замер — будто сам эфир затаил дыхание. Воздух стал плотнее, тяжелее. В нём появился вкус металла и чего-то древнего, почти забытого.</p>\n<p>Там, где ещё мгновение назад царила церемониальная тьма, теперь разливалось мягкое, но неотвратимое сияние. Оно не было похоже на обычный рассвет. Оно было <em>осознанным</em>.</p>\n<p>Я стоял на краю обсидиановой платформы и смотрел, как десять новых светил поднимаются над горизонтом один за другим — каждый своего оттенка. Кроваво-красный. Холодный бирюзовый. Ядовито-зелёный. Золотой, почти ослепительный. Фиолетовый, будто сгусток самой ночи.</p>\n<p>И где-то между ними — едва заметная, почти прозрачная — та, что светила мягче всех. Та, что смотрела прямо на меня.</p>\n<p>Под ногами хрустел чёрный <span class=\"fx-sand\">песок</span>. Каждый шаг оставлял след, который медленно затягивался, будто поверхность дышала.</p>`},2:{num:"Глава II",title:"Первый Рассвет",theme:"ember",html:`<p>Свет не просто осветил мир — он <span class=\"fx-shake\">изменил</span> его.</p>\n<p>Там, где раньше лежала холодная тьма, теперь ползли длинные тени. Они были живыми. Двигались не так, как должны двигаться тени от солнца. Они тянулись к источникам света, словно хотели поглотить их.</p>\n<p style=\"color:#fde68a;font-style:italic\">Один из красных солнец вспыхнул ярче. На секунду весь горизонт окрасился в цвет <span class=\"fx-blood\">крови</span> и раскалённого металла.</p>\n<p>Я почувствовал тепло на коже. Настоящее, обжигающее. Эфир вокруг начал дрожать — мелкая вибрация, которую скорее чувствуешь костями, чем слышишь.</p>\n<p>Где-то далеко, за линией хребтов, что-то огромное медленно поднялось. Слишком большое, чтобы быть живым существом. Слишком правильное, чтобы быть горой.</p>\n<p>И в этот момент я понял: рассвет здесь — не начало дня. Это начало охоты.</p>\n<p><span class=\"fx-moon\">Белая Луна</span>, даже уйдя за горизонт, всё ещё смотрела. Я чувствовал её взгляд затылком.</p>`}};

function resize(){w=canvas.width=atmCanvas.width=innerWidth;h=canvas.height=atmCanvas.height=innerHeight;initParts();initAtm()}
class Part{constructor(t){this.t=t;this.reset(true)}reset(init){this.x=Math.random()*w;this.y=init?Math.random()*h:(this.t==='flame'||this.t==='ember'?h+3:-5);if(this.t==='winter'){this.s=Math.random()*1.3+.3;this.vy=Math.random()*.5+.12;this.vx=(Math.random()-.5)*.25;this.o=Math.random()*.18+.06;this.ph=Math.random()*6.28}else if(this.t==='flame'||this.t==='ember'){this.s=Math.random()*1.4+.3;this.vy=-(Math.random()*.8+.2);this.vx=(Math.random()-.5)*.28;this.life=1;this.dec=Math.random()*.004+.0012}else if(this.t==='mist'){this.s=Math.random()*36+16;this.vy=Math.random()*.04+.008;this.vx=(Math.random()-.5)*.07;this.o=Math.random()*.02+.006}else{this.s=Math.random()*1+.2;this.vy=Math.random()*.14+.03;this.vx=(Math.random()-.5)*.07;this.o=Math.random()*.12+.04;this.ph=Math.random()*6.28}}update(){if(this.t==='winter'){this.ph+=.01;this.x+=Math.sin(this.ph)*.12+this.vx;this.y+=this.vy;if(this.y>h+4)this.reset()}else if(this.t==='flame'||this.t==='ember'){this.x+=this.vx;this.y+=this.vy;this.life-=this.dec;if(this.life<=0||this.y<-8)this.reset()}else if(this.t==='mist'){this.x+=this.vx;this.y+=this.vy;if(this.y>h+40)this.reset()}else{this.y+=this.vy;this.x+=this.vx;this.ph+=.014;if(this.y>h+4)this.reset()}}draw(){const {r,g,b}=partColor;if(this.t==='flame'){const gr=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.s*1.4);gr.addColorStop(0,`rgba(${r},${g},${b},${this.life*.55})`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);ctx.beginPath();ctx.arc(this.x,this.y,this.s*1.4,0,6.28);ctx.fillStyle=gr;ctx.fill()}else if(this.t==='ember'){const gr=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.s*1.3);gr.addColorStop(0,`rgba(251,191,36,${this.life*.6})`);gr.addColorStop(1,'rgba(249,115,22,0)');ctx.beginPath();ctx.arc(this.x,this.y,this.s*1.3,0,6.28);ctx.fillStyle=gr;ctx.fill()}else if(this.t==='mist'){const gr=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.s);gr.addColorStop(0,`rgba(${r},${g},${b},${this.o})`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,6.28);ctx.fillStyle=gr;ctx.fill()}else{const a=(this.o||.1)*(this.ph?0.55+0.45*Math.sin(this.ph):1);ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,6.28);ctx.fillStyle=`rgba(${r},${g},${b},${a})`;ctx.fill()}}}
function initParts(){parts=[];if(intensity<=0)return;const n=Math.min(Math.floor(intensity/35*36),Math.floor(w*h/24000));for(let i=0;i<n;i++)parts.push(new Part(theme==='void'?'cosmic':theme))}
class AtmPart{constructor(type){this.type=type;this.reset(true)}reset(init){this.x=Math.random()*w;this.y=init?Math.random()*h:h+20;if(this.type==='smoke'||this.type==='fog'){this.s=Math.random()*80+40;this.vy=-(Math.random()*.25+.05);this.vx=(Math.random()-.5)*.4;this.o=Math.random()*.08+.02}else if(this.type==='embers'){this.s=Math.random()*2.5+.5;this.vy=-(Math.random()*1.2+.3);this.vx=(Math.random()-.5)*.6;this.life=1;this.dec=Math.random()*.008+.003}else{this.s=Math.random()*1.8+.4;this.vy=Math.random()*.4+.1;this.vx=(Math.random()-.5)*.5;this.o=Math.random()*.25+.1;this.ph=Math.random()*6.28}}update(){if(this.type==='smoke'||this.type==='fog'){this.x+=this.vx;this.y+=this.vy;this.s+=0.05;if(this.y<-this.s)this.reset()}else if(this.type==='embers'){this.x+=this.vx;this.y+=this.vy;this.life-=this.dec;if(this.life<=0||this.y<-10)this.reset()}else{this.ph+=.02;this.x+=Math.sin(this.ph)*.3+this.vx;this.y+=this.vy;if(this.y>h+10)this.reset()}}draw(){const hex=atmCol[this.type]||'#888';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);const mult=(atmInt[this.type]||30)/100;if(this.type==='smoke'||this.type==='fog'){const gr=atmCtx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.s);gr.addColorStop(0,`rgba(${r},${g},${b},${this.o*mult})`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);atmCtx.beginPath();atmCtx.arc(this.x,this.y,this.s,0,6.28);atmCtx.fillStyle=gr;atmCtx.fill()}else if(this.type==='embers'){const gr=atmCtx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.s*2);gr.addColorStop(0,`rgba(${r},${g},${b},${this.life*.7*mult})`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);atmCtx.beginPath();atmCtx.arc(this.x,this.y,this.s*2,0,6.28);atmCtx.fillStyle=gr;atmCtx.fill()}else{atmCtx.beginPath();atmCtx.arc(this.x,this.y,this.s,0,6.28);atmCtx.fillStyle=`rgba(${r},${g},${b},${this.o*mult})`;atmCtx.fill()}}}
function initAtm(){atmParts=[];['smoke','fog','embers','ash'].forEach(type=>{if(!atm[type])return;const n=Math.floor((atmInt[type]/100)*25);for(let i=0;i<n;i++)atmParts.push(new AtmPart(type))})}
function loop(){ctx.clearRect(0,0,w,h);if(particlesOn&&intensity>0)for(let i=0;i<parts.length;i++){parts[i].update();parts[i].draw()}atmCtx.clearRect(0,0,w,h);for(let i=0;i<atmParts.length;i++){atmParts[i].update();atmParts[i].draw()}requestAnimationFrame(loop)}
function applyGradient(t,m,b){document.documentElement.style.setProperty('--bg-top',t);document.documentElement.style.setProperty('--bg-mid',m);document.documentElement.style.setProperty('--bg-bot',b);document.getElementById('bg-top').value=t;document.getElementById('bg-mid').value=m;document.getElementById('bg-bot').value=b}
function setTheme(t){theme=t;document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===t));const p=PRESETS[t]||PRESETS.flame;applyGradient(p.top,p.mid,p.bot);initParts()}
function colorize(html){let out=html;COLOR_WORDS.forEach(({re,cls})=>{out=out.replace(re,m=>{if(m.includes('<'))return m;return `<span class=\"${cls}\">${m}</span>`})});return out}
function wrapPhrases(html){const div=document.createElement('div');div.innerHTML=html;div.querySelectorAll('p').forEach(p=>{const walker=document.createTreeWalker(p,NodeFilter.SHOW_TEXT,null);const textNodes=[];while(walker.nextNode())textNodes.push(walker.currentNode);textNodes.forEach(tn=>{if(!tn.textContent.trim())return;const words=tn.textContent.split(/(\s+)/);let buf=[],h='';const flush=()=>{if(!buf.length)return;const text=buf.join('');if(text.trim())h+=`<span class=\"ph\">${text}</span>`;else h+=text;buf=[]};let wordCount=0;words.forEach(w=>{if(/^\s+$/.test(w)){buf.push(w);return}if(w==='')return;buf.push(w);wordCount++;const limit=wordCount<=1?3:(Math.random()<0.3?4:3);if(wordCount>=2&&(wordCount>=limit||/[.!?,;:…—–]$/.test(w))){flush();wordCount=0}});flush();if(h){const span=document.createElement('span');span.innerHTML=h;tn.parentNode.replaceChild(span,tn);while(span.firstChild)span.parentNode.insertBefore(span.firstChild,span);span.remove()}})});return div.innerHTML}
function load(n){const c=chapters[n];if(!c)return;cur=n;let html=colorize(c.html);html=wrapPhrases(html);document.getElementById('content').innerHTML=html;document.getElementById('ch-num').textContent=c.num;document.getElementById('ch-title').textContent=c.title;document.getElementById('ch-label').textContent=c.num+' · '+c.title;document.getElementById('cur').textContent=n;document.getElementById('prev').disabled=n<=1;document.getElementById('next').disabled=!chapters[n+1];document.querySelectorAll('.ch-item').forEach(b=>b.classList.toggle('active',+b.dataset.ch===n));if(autoTheme)setTheme(c.theme);document.getElementById('main').scrollTop=0;phrases=[...document.querySelectorAll('#content .ph')];applyMode();requestAnimationFrame(updateFocus)}
function applyMode(){const el=document.getElementById('content');el.className='reader-text mode-'+textMode}
function updateFocus(){if(!focusMode||!phrases.length){phrases.forEach(p=>{p.classList.remove('focus');p.style.opacity='';p.style.transform='';p.style.setProperty('--sc','1')});return}const mid=window.innerHeight*0.42;const range=window.innerHeight*zoneW;phrases.forEach(p=>{const r=p.getBoundingClientRect();if(r.bottom<-80||r.top>h+80){p.style.opacity='0.28';p.style.transform='scale(0.94)';p.classList.remove('focus');return}const center=r.top+r.height*0.5;const dist=Math.abs(center-mid);const t=Math.min(1,dist/range);const ease=1-t*t*(3-2*t);const sc=1+(focusStr-1)*ease;const op=0.30+0.70*ease;const maxSc=Math.min(sc,1.22);p.style.transform=`scale(${maxSc.toFixed(4)})`;p.style.opacity=op.toFixed(3);p.style.setProperty('--sc',maxSc.toFixed(4));p.classList.toggle('focus',ease>0.5)});if(wordFx){document.querySelectorAll('.fx-sand,.fx-shake,.fx-glow,.fx-blood,.fx-moon').forEach(el=>{const r=el.getBoundingClientRect();const center=r.top+r.height*0.5;el.classList.toggle('on',Math.abs(center-mid)<window.innerHeight*0.18)})}}
